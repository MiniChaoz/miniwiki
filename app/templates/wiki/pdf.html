<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 2cm; }
  body { font-family: Helvetica, Arial, sans-serif; font-size: 11pt; color: #1a1a1a; }
  h1 { font-size: 20pt; margin: 0 0 4pt; }
  h2 { font-size: 15pt; margin: 14pt 0 4pt; }
  h3 { font-size: 12.5pt; margin: 12pt 0 4pt; }
  .meta { color: #666; font-size: 9pt; margin-bottom: 10pt; }
  hr { border: none; border-top: 1px solid #ccc; }
  code { font-family: Courier, monospace; background: #f0f0f0; }
  pre { font-family: Courier, monospace; background: #f4f4f4; padding: 6pt; border: 1px solid #ddd; }
  blockquote { color: #555; border-left: 3px solid #999; margin: 6pt 0; padding-left: 8pt; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #bbb; padding: 4pt 6pt; font-size: 10pt; }
  th { background: #eee; }
  img { max-width: 100%; }
  .footer { color: #999; font-size: 8pt; margin-top: 16pt; border-top: 1px solid #ddd; padding-top: 4pt; }
</style>
</head>
<body>
  <h1>{{ page.title }}</h1>
  <div class="meta">
    {{ space.name }} &middot; Stand {{ page.updated_at.strftime('%d.%m.%Y %H:%M') }}
    {% if page.tags %}<br>{% for t in page.tags %}#{{ t.name }}{% if not loop.last %}, {% endif %}{% endfor %}{% endif %}
  </div>
  <hr>
  {{ body_html|safe }}
  <div class="footer">Erzeugt aus {{ wiki_name }}</div>
</body>
</html>
